<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Wandering Journal</title><meta name="theme-color" content="#f3eddf"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="compass">✥</span> The Wandering Journal<small>PLACES, ROADS & THE STORIES BETWEEN</small></div><nav><button id="journeys">Journeys</button><button id="destinations">Destinations</button></nav><button id="account">☷ Journal settings</button></header><div id="notice" role="status"></div><main><aside><div class="section-label">YOUR FIELD GUIDE</div><div class="heading"><h1 id="list-title">Your journeys</h1><button id="new-trip" class="green">+ New</button></div><input id="search" type="search" placeholder="Find a place or journey…" aria-label="Search"><div id="collection"></div><section id="itinerary"></section></aside><section class="map-panel"><div id="map" aria-label="Destination map"></div><div class="map-caption"><strong>Every place has a story.</strong><span id="map-subtitle">A collection of roads less traveled</span></div><div class="map-key">● Destination &nbsp; ◇ Additional stop<br><small>Lines connect stops; Google Maps provides road directions.</small></div></section><article id="details"></article></main><dialog id="modal"><form id="modal-form"><div class="heading"><h2 id="modal-title"></h2><button type="button" id="close-modal" aria-label="Close">✕</button></div><div id="modal-body"></div><button id="modal-save" class="green" type="submit">Save</button></form></dialog><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin></script><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
